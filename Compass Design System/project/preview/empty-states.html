<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #1e1e1e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 12px; color: #cccccc; padding: 16px; box-sizing: border-box; }
  .section-title { font-size: 10px; font-weight: 600; color: #858585; letter-spacing: 0.08em; text-transform: uppercase; margin: 14px 0 8px; }
  .section-title:first-child { margin-top: 0; }

  .states-row { display: flex; gap: 12px; }
  .state-card {
    flex: 1; background: #252526; border: 1px solid #3c3c3c; border-radius: 2px;
    padding: 24px 16px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .state-icon { font-size: 28px; opacity: 0.5; margin-bottom: 4px; }
  .state-icon svg { width: 32px; height: 32px; stroke: #858585; }
  .state-title { font-size: 0.85rem; color: #cccccc; font-weight: 400; margin: 0; }
  .state-sub { font-size: 0.82rem; color: #858585; margin: 0; }
  .state-sub code { font-family: "SF Mono", Consolas, monospace; font-size: 0.9em; padding: 0 0.2em; background: rgba(128,128,128,0.15); border-radius: 2px; }
  .state-action { margin-top: 4px; color: #3794ff; font-size: 0.82rem; text-decoration: underline; cursor: pointer; }
</style>
</head>
<body class="nc-root">
  <div class="section-title">Empty / Error States</div>
  <div class="states-row">
    <!-- No projects -->
    <div class="state-card">
      <div class="state-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 13h4"/></svg>
      </div>
      <p class="state-title">No .NET projects found in this workspace.</p>
      <p class="state-sub">Open a folder containing a <code>.csproj</code>, <code>.fsproj</code>, or <code>.vbproj</code> file.</p>
    </div>

    <!-- SDK not found -->
    <div class="state-card">
      <div class="state-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#cca700" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>
      <p class="state-title">The .NET SDK was not found.</p>
      <p class="state-sub">NuGet Compass needs <code>dotnet</code> 8.0+ on PATH.</p>
      <span class="state-action">Get the .NET SDK</span>
    </div>

    <!-- Loading -->
    <div class="state-card" style="justify-content: center;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
        <div style="width:24px;height:24px;border:2px solid rgba(117,190,255,0.2);border-top-color:#75beff;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <p class="state-title" style="color:#75beff;">Discovering .NET projects…</p>
      </div>
    </div>
  </div>
  <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</body>
</html>
