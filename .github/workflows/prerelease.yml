name: Pre-release

on:
  push:
    branches: [master]

jobs:
  publish-prerelease:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip prerelease]')"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compute pre-release version
        id: ver
        working-directory: packages/extension
        run: |
          BASE=$(node -p "require('./package.json').version")
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          if [ $((MINOR % 2)) -eq 0 ]; then
            MINOR=$((MINOR + 1))
          fi
          PRE_VERSION="${MAJOR}.${MINOR}.${GITHUB_RUN_NUMBER}"
          echo "version=${PRE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Pre-release version: ${PRE_VERSION}"

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: Set version and publish pre-release
        working-directory: packages/extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx vsce publish ${{ steps.ver.outputs.version }} --pre-release --no-dependencies --no-git-tag-version
