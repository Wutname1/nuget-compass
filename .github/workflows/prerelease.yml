name: Pre-release

on:
  push:
    tags:
      - '*.*.*-*'

jobs:
  publish-prerelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve tag version
        id: ver
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: Generate changelog
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROJECT_NAME: 'NuGet Compass Changelog'
        run: |
          chmod +x .github/scripts/generate-changelog.sh
          .github/scripts/generate-changelog.sh CHANGELOG.md

      - name: Add changelog to run summary
        run: cat CHANGELOG.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package VSIX
        working-directory: packages/extension
        run: npx vsce package ${{ steps.ver.outputs.version }} --pre-release --no-dependencies --no-git-tag-version --out nuget-compass-${{ steps.ver.outputs.version }}.vsix

      - name: Publish pre-release to Marketplace
        working-directory: packages/extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --pre-release --packagePath nuget-compass-${{ steps.ver.outputs.version }}.vsix

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          prerelease: true
          body_path: CHANGELOG.md
          files: packages/extension/nuget-compass-${{ steps.ver.outputs.version }}.vsix
