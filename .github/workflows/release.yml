name: Release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish-release:
    runs-on: ubuntu-latest
    if: "!contains(github.ref_name, '-')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve tag version
        id: ver
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: Package VSIX
        working-directory: packages/extension
        run: npx vsce package ${{ steps.ver.outputs.version }} --no-dependencies --no-git-tag-version --out nuget-compass-${{ steps.ver.outputs.version }}.vsix

      - name: Publish to Marketplace
        working-directory: packages/extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath nuget-compass-${{ steps.ver.outputs.version }}.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: packages/extension/nuget-compass-${{ steps.ver.outputs.version }}.vsix
